name: Build IMDb data and test
on:
  workflow_dispatch:
  pull_request:
    branches: ['claude/media-duplicate-detection-app-01GZPJLbvQTgruQk9FtQDvZs']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinema-knowledge-graph
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_imdb_dataset.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Commit generated dataset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/movies.json
          git diff --cached --quiet || git commit -m "data: refresh IMDb cinema graph snapshot"
          git push origin HEAD:cinema-knowledge-graph
